# Hall chimes on the ESP32-S3-BOX (chime_box/): the chimes' display + control board. Builds on its own and publishes
# ONLY https://jobot101.github.io/Ragamuffin-Flasher/chimebox/ (the page, sol/ and chime/ untouched).
# Same bell machine as chime/, on the BOX's free pins, with the BOX screen as a front panel and the solenoid tester's
# TAP. 16 MB image (two 3 MB OTA slots), octal PSRAM (the BOX's WROOM-1 N16R8). manifest.json carries "box": true so
# the board's Install latest only ever takes a BOX build. FW_VERSION = the short SHA, same as the manifest.
name: chimebox

on:
  push:
    branches: [main, "dev/**"]
    paths: [chime_box/**, .github/workflows/chimebox.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chimebox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/.cache/arduino
            ~/Arduino/libraries
          key: arduino-esp32-3.2.0-chimebox

      - uses: arduino/setup-arduino-cli@v2
      - name: install esp32 core 3.x + libraries
        run: |
          URL=https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index --additional-urls $URL
          arduino-cli core install esp32:esp32@3.2.0 --additional-urls $URL
          arduino-cli lib update-index
          arduino-cli lib install "Adafruit MCP23017 Arduino Library" "PubSubClient" "LovyanGFX"

      - name: compile
        run: |
          set -o pipefail
          echo "#define FW_VERSION \"${GITHUB_SHA::7}\"" > chime_box/version.h
          arduino-cli compile --fqbn "esp32:esp32:esp32s3:CDCOnBoot=cdc,PSRAM=opi,FlashSize=16M,PartitionScheme=app3M_fat9M_16MB" \
            --export-binaries --output-dir out chime_box 2>&1 | tee chimebox.log

      - name: report compile errors
        if: failure()
        run: grep -E "error:|Error" chimebox.log | head -30 | while IFS= read -r l; do echo "::error::${l//%/%25}"; done

      - name: package
        run: |
          B0=$(find ~/.arduino15 -name boot_app0.bin | head -1)
          d=chimebox; mkdir -p pub/$d
          cp out/chime_box.ino.bootloader.bin pub/$d/bootloader.bin
          cp out/chime_box.ino.partitions.bin pub/$d/partitions.bin
          cp "$B0" pub/$d/boot_app0.bin
          cp out/chime_box.ino.bin pub/$d/chime_box.bin
          cat > pub/$d/manifest.json <<JSON
          {"name":"hall chimes box","box":true,"version":"${GITHUB_SHA::7}","builds":[{"chipFamily":"ESP32-S3","parts":[
            {"path":"bootloader.bin","offset":0},{"path":"partitions.bin","offset":32768},
            {"path":"boot_app0.bin","offset":57344},{"path":"chime_box.bin","offset":65536}]}]}
          JSON
          ls -la pub/$d
          echo "::notice::chimebox ${GITHUB_SHA::7}: $(stat -c %s pub/$d/chime_box.bin) bytes"

      - uses: actions/upload-artifact@v4
        with:
          name: chimebox
          path: pub/chimebox/

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: { group: gh-pages, cancel-in-progress: false }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: chimebox, path: chimebox }
      - name: publish chimebox/ only (rest of the flasher site untouched)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: chimebox
          destination_dir: chimebox
          keep_files: true
